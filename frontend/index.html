<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>GasGuard — IoT Gas Safety Dashboard</title>
    <meta
      name="description"
      content="GasGuard IoT-based LPG leak detection and safety monitoring dashboard."
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Prevent flash of unstyled content -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #F1EFE8;
        font-family: -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      }
      /* Hide app until Vue mounts to prevent layout flash */
      #app { opacity: 0; transition: opacity 0.15s ease; }
      #app.mounted { opacity: 1; }
    </style>
  </head>

  <body>
    <!-- Vue app mounts here -->
    <div id="app"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.js"></script>

    <!-- Reveal app after mount to prevent flash -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const observer = new MutationObserver(() => {
          const app = document.getElementById("app")
          if (app && app.children.length > 0) {
            app.classList.add("mounted")
            observer.disconnect()
          }
        })
        observer.observe(document.getElementById("app"), {
          childList: true
        })
      })
    </script>
  </body>
</html>
